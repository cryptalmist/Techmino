name: Techmino CI

on:
  push:
    branches: [main, ci*]
    tags: [pre*, v*]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  BUILD_ASSETS_FOLDER: ./.github/build
  BUILD_TYPE: ${{ fromJSON('["dev", "release"]')[startsWith(github.ref, 'refs/tags/v')] }}
  COLD_CLEAR_DOWNLOAD_URL: https://github.com/26F-Studio/cold_clear_ai_love2d_wrapper/releases/download/11.5
  CORE_LOVE_ARTIFACT_NAME: core_love_package
  CORE_LOVE_PACKAGE_PATH: ./core.love

jobs:
  get-info:
    runs-on: ubuntu-latest
    outputs:
      app-name: ${{ steps.app-info.outputs.app-name }}
      version-name: ${{ steps.app-info.outputs.version-name }}
      version-string: ${{ steps.app-info.outputs.version-string }}
      version-code: ${{ steps.app-info.outputs.version-code }}
      update-title: ${{ steps.app-info.outputs.update-title }}
      update-note: ${{ steps.app-info.outputs.update-note }}
      commit-hash: ${{ steps.git-info.outputs.commit-hash }}
      base-name: ${{ steps.assemble-base-name.outputs.base-name }}
    steps:
      - uses: actions/checkout@v4
      - name: Install lua
        run: |
          sudo apt-get install lua5.3 -y
      - name: Get app info
        id: app-info
        shell: lua {0}
        run: |
          local version = require "version"
          os.execute('echo "app-name=Techmino" >> $GITHUB_OUTPUT')
          os.execute('echo "version-name=' .. version.name .. '" >> $GITHUB_OUTPUT')
          os.execute('echo "version-string=' .. version.string:gsub("%a", "") .. '" >> $GITHUB_OUTPUT')
          os.execute('echo "version-code=' .. tostring(version.code) .. '" >> $GITHUB_OUTPUT')

          local f = io.open("updateLog.txt", 'r')
          local note = f:read("*a")
          f:close()
          local p1 = note:find("\n%d") + 1
          local p2 = note:find("\n", p1) - 1
          os.execute('echo "update-title=' .. note:sub(p1, p2) .. '" >> $GITHUB_OUTPUT')
          local p3 = note:find("\n", note:find("\n%d") + 1) + 1
          local p4 = note:find("\n%d", p3 + 1)
          updateNote = note:sub(p3, p4 - 2)
              :gsub("                ", "- ")
              :gsub("        ", "# ")
          os.execute('echo "update-note<<EOF" >> $GITHUB_OUTPUT')
          os.execute('echo "' .. updateNote .. '" >> $GITHUB_OUTPUT')
          os.execute('echo "EOF" >> $GITHUB_OUTPUT')
      - name: Get git info
        id: git-info
        shell: bash
        run: |
          COMMIT_HASH=$(git rev-parse --short ${{ GITHUB.SHA }})
          echo "commit-hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
      - name: Assemble package base name
        id: assemble-base-name
        shell: bash
        run: |
          BASE_NAME=Techmino_${{ steps.app-info.outputs.version-string }}_${{ steps.git-info.outputs.commit-hash }}_#${{ GITHUB.RUN_NUMBER }}
          echo "base-name=$BASE_NAME" >> $GITHUB_OUTPUT

  build-core:
    runs-on: ubuntu-latest
    needs: get-info
    env:
      OUTPUT_FOLDER: ./build
      RELEASE_FOLDER: ./release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Process app name
        id: process-app-name
        shell: python3 {0}
        run: |
          import os
          import re
          with open(os.getenv('GITHUB_OUTPUT'), 'a') as f:
            f.write('product-name=' + re.sub(r'[^A-Za-z0-9]+', '_', '${{ needs.get-info.outputs.app-name }}') + '\n')
      - name: Build core love package
        uses: love-actions/love-actions-core@v1
        with:
          build-list: ./media/ ./parts/ ./Zframework/ ./conf.lua ./main.lua ./version.lua ./legals.md ./license.txt
          package-path: ${{ env.CORE_LOVE_PACKAGE_PATH }}
      - name: Upload core love package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CORE_LOVE_ARTIFACT_NAME }}
          path: ${{ env.CORE_LOVE_PACKAGE_PATH }}

  build-iOS:
    runs-on: macos-latest
    needs: [get-info, build-core]
    if: github.event_name != 'pull_request'
    env:
      OUTPUT_FOLDER: ./build
      RELEASE_FOLDER: ./release
      LOVE_IOS_SRC: ./love-ios
      IOS_PROJECT: ./ios-build/Techmino.xcodeproj
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Process app name
        id: process-app-name
        shell: python3 {0}
        run: |
          import os
          import re
          with open(os.getenv('GITHUB_OUTPUT'), 'a') as f:
            if "${{ env.BUILD_TYPE }}" == "dev":
              f.write('bundle-id=org.f26_studio.' + re.sub(r'[^A-Za-z0-9]+', '_', '${{ needs.get-info.outputs.app-name }}') + '.snapshot\n')
              f.write('product-name=' + re.sub(r'[^A-Za-z0-9]+', '-', '${{ needs.get-info.outputs.app-name }}') + '_Snapshot\n')
            else:
              f.write('bundle-id=org.f26_studio.' + re.sub(r'[^A-Za-z0-9]+', '_', '${{ needs.get-info.outputs.app-name }}') + '\n')
              f.write('product-name=' + re.sub(r'[^A-Za-z0-9]+', '-', '${{ needs.get-info.outputs.app-name }}') + '\n')
      - name: Download core love package
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CORE_LOVE_ARTIFACT_NAME }}
      - name: Install LÖVE iOS build deps
        shell: bash
        run: |
          brew install freetype coreutils
      - name: Get LÖVE 11.5 iOS source
        shell: bash
        run: |
          curl -L --retry 5 https://github.com/love2d/love/archive/refs/tags/11.5.tar.gz -o love-src.tar.gz
          tar xzf love-src.tar.gz
          mv love-11.5 ${{ env.LOVE_IOS_SRC }}
      - name: Download LÖVE iOS dependency XCFrameworks
        shell: bash
        run: |
          curl -L --retry 5 https://github.com/love2d/love-apple-dependencies/archive/refs/tags/11.5.tar.gz -o deps.tar.gz
          tar xzf deps.tar.gz
          mkdir -p ${{ env.LOVE_IOS_SRC }}/platform/xcode/ios/libraries
          cp -r love-apple-dependencies-11.5/iOS/libraries/* ${{ env.LOVE_IOS_SRC }}/platform/xcode/ios/libraries/
      - name: Download ColdClear iOS CCloader
        shell: bash
        run: |
          curl -L --retry 5 ${{ env.COLD_CLEAR_DOWNLOAD_URL }}/iOS.zip -o cc-ios.zip
          unzip -o -q cc-ios.zip -d cc-ios
          CCLOADER_PATH=$(find cc-ios -name "libCCloader.a" | head -1)
          echo "CCLOADER_PATH=$CCLOADER_PATH" >> $GITHUB_ENV
          echo "Found CCloader: $CCLOADER_PATH"
      - name: Copy libCCloader.a into Xcode project dir
        shell: bash
        run: |
          mkdir -p ${{ env.LOVE_IOS_SRC }}/platform/xcode
          cp ${{ env.CCLOADER_PATH }} ${{ env.LOVE_IOS_SRC }}/platform/xcode/libCCloader.a
      - name: Apply LÖVE iOS patch (CCloader + vibrate)
        shell: bash
        run: |
          cd ${{ env.LOVE_IOS_SRC }}
          # Apply the official iOS patch (fixes vibrate signature + CCloader extern)
          patch -p1 < ../${{ env.BUILD_ASSETS_FOLDER }}/iOS/love.patch
          # Add CCloader extern declaration + call before runlove
          sed -i '' 's/^static DoneAction runlove(int argc, char \*\*argv, int \&retval)/extern "C" {\n    int luaopen_CCloader(lua_State *L);\n}\n\nstatic DoneAction runlove(int argc, char **argv, int \&retval)/' src/love.cpp
          sed -i '' 's/^    luaL_openlibs(L);$/    luaL_openlibs(L);\n\n    \/\/ Init CCloader\n    luaopen_CCloader(L);/' src/love.cpp
      - name: Build LÖVE iOS app via Xcode
        shell: bash
        run: |
          cd ${{ env.LOVE_IOS_SRC }}/platform/xcode
          xcodebuild -project love.xcodeproj -scheme love-ios -configuration Release -sdk iphoneos ONLY_ACTIVE_ARCH=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM="" IPHONEOS_DEPLOYMENT_TARGET=12.0 OTHER_LDFLAGS="-lCCloader" LIBRARY_SEARCH_PATHS="."
      - name: Create iOS app bundle structure
        shell: bash
        run: |
          PROJECT_ROOT="${{ env.IOS_PROJECT }}/.."
          rm -rf "$PROJECT_ROOT/Payload"
          mkdir -p "$PROJECT_ROOT/Payload/Techmino.app"

          BUNDLE_ID="${{ steps.process-app-name.outputs.bundle-id }}"
          VERSION_STRING="${{ needs.get-info.outputs.version-string }}"

          cp ${{ env.BUILD_ASSETS_FOLDER }}/iOS/Info.plist.template "$PROJECT_ROOT/Techmino-Info.plist"
          cp ${{ env.BUILD_ASSETS_FOLDER }}/iOS/Info.plist.template "$PROJECT_ROOT/Payload/Techmino.app/Info.plist"
          sed -i "" "s/%%BUNDLE_ID%%/$BUNDLE_ID/g" "$PROJECT_ROOT/Techmino-Info.plist"
          sed -i "" "s/%%VERSION_STRING%%/$VERSION_STRING/g" "$PROJECT_ROOT/Techmino-Info.plist"
          sed -i "" "s/%%BUNDLE_ID%%/$BUNDLE_ID/g" "$PROJECT_ROOT/Payload/Techmino.app/Info.plist"
          sed -i "" "s/%%VERSION_STRING%%/$VERSION_STRING/g" "$PROJECT_ROOT/Payload/Techmino.app/Info.plist"

      - name: Copy core.love into app bundle
        shell: bash
        run: |
          APP_DIR=${{ env.IOS_PROJECT }}/../Payload/Techmino.app
          mkdir -p "$APP_DIR"
          cp ${{ env.CORE_LOVE_PACKAGE_PATH }} "$APP_DIR/core.love"
          cp -r ${{ env.BUILD_ASSETS_FOLDER }}/iOS/${{ env.BUILD_TYPE }}/icon/* "$APP_DIR/" 2>/dev/null || true

      - name: Code sign iOS app
        id: sign
        shell: bash
        run: |
          if [ -z "${{ secrets.IOS_CERT_P12 }}" ] || [ -z "${{ secrets.IOS_PROVISIONING_PROFILE }}" ]; then
            echo "No iOS signing secrets provided - building unsigned .ipa"
            echo "signed=false" >> $GITHUB_OUTPUT
          else
            echo "Setting up iOS code signing..."
            echo "${{ secrets.IOS_CERT_P12 }}" | base64 -D > signing.p12
            security create-keychain -p "" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "" build.keychain
            security import signing.p12 -k build.keychain -P "" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
            echo "${{ secrets.IOS_PROVISIONING_PROFILE }}" | base64 -D > Techmino.mobileprovision
            PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
            mkdir -p "$PROFILE_DIR"
            cp Techmino.mobileprovision "$PROFILE_DIR/"
            echo "signed=true" >> $GITHUB_OUTPUT
          fi

      - name: Build .ipa
        shell: bash
        run: |
          APP_DIR=${{ env.IOS_PROJECT }}/../Payload/Techmino.app
          rm -rf "$APP_DIR"
          mkdir -p "$APP_DIR"

          # Find the built LÖVE app bundle (xcodebuild puts it in DerivedData)
          BUILT_APP=$(ls -td "${HOME}/Library/Developer/Xcode/DerivedData"/*/Build/Products/Release-iphoneos/love.app 2>/dev/null | head -1)
          echo "Built app: $BUILT_APP"
          if [ -z "$BUILT_APP" ]; then
            echo "ERROR: Could not find built love.app in DerivedData"
            exit 1
          fi
          cp -r "$BUILT_APP/." "$APP_DIR/"

          # Copy Techmino's Info.plist (overrides LÖVE's)
          cp ${{ env.IOS_PROJECT }}/../Techmino-Info.plist "$APP_DIR/Info.plist"

          # Rename LÖVE binary to Techmino (matching CFBundleExecutable in Info.plist)
          if [ -f "$APP_DIR/love" ]; then
            mv "$APP_DIR/love" "$APP_DIR/Techmino"
          fi
          chmod +x "$APP_DIR/Techmino"

          # Copy core.love into the bundle
          cp ${{ env.CORE_LOVE_PACKAGE_PATH }} "$APP_DIR/core.love"

          # Copy app icon
          cp ${{ env.BUILD_ASSETS_FOLDER }}/iOS/${{ env.BUILD_TYPE }}/icon/icon_1024x1024.png "$APP_DIR/Icon-1024.png" 2>/dev/null || true

          # Remove any existing code signature (unsigned build)
          rm -rf "$APP_DIR/_CodeSignature"

          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            echo "Code signing with provisioning profile..."
            security import signing.p12 -k build.keychain -P "" -T /usr/bin/codesign
            cp Techmino.mobileprovision "$APP_DIR/embedded.mobileprovision"
            codesign -f -s "iPhone Distribution" --keychain build.keychain "$APP_DIR"
          else
            echo "Skipping code signing (unsigned .ipa)"
          fi

          # Package .ipa
          IPA_NAME="${{ steps.process-app-name.outputs.product-name }}.ipa"
          cd ${{ env.IOS_PROJECT }}/..
          rm -f "$IPA_NAME"
          zip -r "$IPA_NAME" Payload
          mkdir -p "${{ github.workspace }}/${{ env.OUTPUT_FOLDER }}"
          mv "$IPA_NAME" "${{ github.workspace }}/${{ env.OUTPUT_FOLDER }}/"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.get-info.outputs.base-name }}_iOS
          path: ${{ env.OUTPUT_FOLDER }}/${{ steps.process-app-name.outputs.product-name }}.ipa

      - name: Prepare for release
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p ${{ env.RELEASE_FOLDER }}
          cp ${{ env.OUTPUT_FOLDER }}/${{ steps.process-app-name.outputs.product-name }}.ipa ${{ env.RELEASE_FOLDER }}/${{ steps.process-app-name.outputs.product-name }}_IOS.ipa

      - name: Generate source.json for LiveContainer
        if: github.event_name == 'push'
        shell: bash
        run: |
          VERSION="${{ needs.get-info.outputs.version-string }}"
          IPA_NAME="${{ steps.process-app-name.outputs.product-name }}_IOS.ipa"
          IPA_PATH="${{ env.RELEASE_FOLDER }}/$IPA_NAME"
          if [ -f "$IPA_PATH" ]; then
            if command -v stat >/dev/null 2>&1; then
              IPASIZE=$(stat -f%z "$IPA_PATH" 2>/dev/null || stat -c%s "$IPA_PATH" 2>/dev/null || echo 0)
            else
              IPASIZE=0
            fi
          else
            IPASIZE=0
          fi
          cat > source.json <<EOF
          {
            "name": "Techmino",
            "packages": [
              {
                "identifier": "org.f26_studio.Techmino",
                "name": "Techmino",
                "version": "$VERSION",
                "description": "Techmino - Tetromino stacking game by 26F-Studio",
                "developer": "26F-Studio",
                "author": "26F-Studio",
                "section": "Games",
                "url": "https://github.com/cryptalmist/Techmino/releases/download/latest/Techmino_IOS.ipa",
                "icon": "https://raw.githubusercontent.com/cryptalmist/Techmino/main/.github/build/iOS/dev/icon/icon_1024x1024.png",
                "size": $IPASIZE
              }
            ]
          }
          EOF
          echo "=== source.json ==="
          cat source.json

      - name: Attach IPA and source.json to Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IPA="${{ env.RELEASE_FOLDER }}/${{ steps.process-app-name.outputs.product-name }}_IOS.ipa"
          SRC="source.json"
          TAG="latest"
          echo "tag=$TAG ipa=$IPA src=$SRC"
          if [ ! -f "$IPA" ]; then
            echo "IPA not found: $IPA"
            exit 1
          fi
          if [ ! -f "$SRC" ]; then
            echo "source.json not found: $SRC"
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "${{ github.sha }}" \
              --title "Latest" \
              --notes "Latest Techmino build for LiveContainer" \
              --prerelease=false \
              || gh release view "$TAG" >/dev/null
          fi
          gh release upload "$TAG" "$IPA" --clobber
          gh release upload "$TAG" "$SRC" --clobber

  post-build:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      [
        get-info,
        build-core,
        build-iOS,
      ]
    env:
      ACTION_TYPE: ${{ fromJSON('[["Development", "Pre-release"], ["Release", "Release"]]')[startsWith(github.ref, 'refs/tags/v')][startsWith(github.ref, 'refs/tags/pre')] }}
    steps:
      - name: Cleanup
        uses: geekyeggo/delete-artifact@v5
        with:
          name: ${{ env.CORE_LOVE_ARTIFACT_NAME }}
